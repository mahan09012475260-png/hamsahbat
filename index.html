<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هم‌صحبت</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:white;font-family:Tahoma,Arial}
header{padding:22px;text-align:center;background:#191922;color:#65aaff;font-size:25px;font-weight:bold}
main{max-width:500px;margin:35px auto;padding:20px}
h2{text-align:center}
input{width:100%;padding:14px;margin:9px 0;border:1px solid #444;border-radius:10px;background:#20202a;color:white}
button{width:100%;padding:14px;margin-top:12px;background:#2878db;color:white;border:0;border-radius:10px;font-size:16px}
.note{text-align:center;color:#aaa;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<header>هم‌صحبت 💬</header>
<main>
<h2>به هم‌صحبت خوش آمدی</h2>
<p>برای ورود، شناسه و رمز عبور آزمایشی انتخاب کن.</p>
<input id="user" placeholder="شناسه آزمایشی">
<input id="pass" type="password" placeholder="رمز عبور">
<button onclick="login()">ورود آزمایشی</button>
<p id="result"></p>
<div class="note">نسخه نمایشی؛ هنوز حساب واقعی و چت آنلاین فعال نیست.</div>
</main>
<script>
function login(){
 const u=document.getElementById('user').value.trim();
 const p=document.getElementById('pass').value;
 document.getElementById('result').textContent=
 u && p ? 'خوش آمدی '+u+'! این ورود فقط نمایشی است.' :
 'لطفاً شناسه و رمز را وارد کن.';
}
</script>
</body>
</html>
